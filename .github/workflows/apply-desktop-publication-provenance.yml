name: Apply Desktop Publication Provenance Fix

on:
  push:
    branches:
      - fix/desktop-publication-provenance
    paths:
      - ".github/patches/desktop-publication-provenance.patch"
      - ".github/workflows/apply-desktop-publication-provenance.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply desktop publication provenance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-publication-provenance
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          git apply --check .github/patches/desktop-publication-provenance.patch
          git apply --index .github/patches/desktop-publication-provenance.patch
          git rm \
            .github/patches/desktop-publication-provenance.patch \
            .github/workflows/apply-desktop-publication-provenance.yml
          git diff --check --cached

      - name: Install Desktop dependencies
        run: npm ci --ignore-scripts

      - name: Validate provenance and bootstrap contracts
        run: |
          set -euo pipefail
          npm --workspace apps/desktop exec -- \
            vitest run \
              scripts/write-build-stamp.test.mjs \
              electron/bootstrap-runner.test.ts
          bash -n scripts/install.sh
          python - <<'PY'
          from pathlib import Path

          ps = Path('scripts/install.ps1').read_text(encoding='utf-8')
          assert 'HERMES_INSTALL_REPOSITORY' in ps
          assert 'expected owner/repo' in ps
          PY

      - name: Commit generated fix
        run: |
          set -euo pipefail
          git config user.name "cloudseed-fix[bot]"
          git config user.email "cloudseed-fix[bot]@users.noreply.github.com"
          git commit -m "fix(desktop): apply desktop publication provenance"
          git push origin HEAD:fix/desktop-publication-provenance
