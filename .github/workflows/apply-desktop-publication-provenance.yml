name: Apply Desktop Publication Provenance Fix

on:
  push:
    branches:
      - fix/desktop-publication-provenance
    paths:
      - ".github/patches/desktop-publication-provenance.patch"
      - ".github/scripts/apply_desktop_publication_provenance.py"
      - ".github/workflows/apply-desktop-publication-provenance.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/patches/desktop-publication-provenance.patch"
      - ".github/scripts/apply_desktop_publication_provenance.py"
      - ".github/workflows/apply-desktop-publication-provenance.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'apply desktop publication provenance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-publication-provenance
          fetch-depth: 0

      - name: Apply exact reviewed provenance changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_desktop_publication_provenance.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:
                  raise SystemExit(f"{relative}: expected one reviewed fragment, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          new = '''    if count < 1:
                  raise SystemExit(f"{relative}: reviewed fragment is missing")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          if text.count(old) != 1:
              raise SystemExit('transformer guard block changed unexpectedly')
          text = text.replace(old, new, 1)

          weak_segment = '[0-9A-Za-z_.-]+'
          strict_segment = '[0-9A-Za-z][0-9A-Za-z_.-]*'
          segment_count = text.count(weak_segment)
          if segment_count < 4:
              raise SystemExit(
                  f'expected at least four owner/repo regex segments, found {segment_count}'
              )
          text = text.replace(weak_segment, strict_segment)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/apply_desktop_publication_provenance.py
          git rm -f \
            .github/patches/desktop-publication-provenance.patch \
            .github/scripts/apply_desktop_publication_provenance.py \
            .github/workflows/apply-desktop-publication-provenance.yml
          git add \
            apps/desktop/electron/bootstrap-runner.ts \
            apps/desktop/electron/bootstrap-runner.test.ts \
            apps/desktop/electron/main.ts \
            apps/desktop/scripts/write-build-stamp.mjs \
            apps/desktop/scripts/write-build-stamp.test.mjs \
            scripts/install.sh \
            scripts/install.ps1
          git diff --check --cached

      - name: Install Desktop dependencies
        run: npm ci --ignore-scripts

      - name: Validate provenance and bootstrap contracts
        run: |
          set -euo pipefail
          npm --workspace apps/desktop exec -- \
            vitest run \
              scripts/write-build-stamp.test.mjs \
              electron/bootstrap-runner.test.ts
          npm --workspace apps/desktop run typecheck
          bash -n scripts/install.sh
          python - <<'PY'
          from pathlib import Path

          ps = Path('scripts/install.ps1').read_text(encoding='utf-8')
          assert 'HERMES_INSTALL_REPOSITORY' in ps
          assert 'expected owner/repo' in ps
          PY

      - name: Commit generated fix
        run: |
          set -euo pipefail
          git config user.name "cloudseed-fix[bot]"
          git config user.email "cloudseed-fix[bot]@users.noreply.github.com"
          git commit -m "fix(desktop): apply desktop publication provenance"
          git push origin HEAD:fix/desktop-publication-provenance
