name: Bug report
description: Something on the board is wrong or missing
labels: [bug]
body:
  - type: input
    id: hermes
    attributes:
      label: Hermes version
      description: Output of `hermes --version`
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Duty Board version or commit
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Waiting on you
        - No reply yet
        - Running
        - Background jobs
        - Scheduled jobs
        - Recently finished
        - Standing goals
        - Whole page / other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Please redact message contents. Section, timing and any warning banner text are usually enough.
    validations:
      required: true
