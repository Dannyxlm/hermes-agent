name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend bundle and translations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Intl.DurationFormat ships in Node 23+; the bundle falls back without it,
          # but the render check should exercise the path modern browsers take.
          node-version: "24"
      - name: Syntax check
        run: node --check dashboard/dist/index.js
      - name: Bundle carries the current catalogs
        run: node tools/build_i18n.mjs --check
      - name: Catalogs complete (keys, placeholders, plural forms)
        run: node tests/js/i18n_check.mjs
      - name: i18n runtime (locale resolution, plurals, numbers, durations)
        run: node tests/js/runtime_check.mjs
      - name: Install React for the render check
        working-directory: tests/js
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Render every locale with React
        run: node tests/js/render_check.mjs
